# Residual-mode counterpart to tucker_rank_0.05.yaml -- see
# tucker_rank_0.75_residual.yaml's comment for the full explanation,
# shared by all 4 "_residual" files. Same seed, same 1985-2014 training
# window, same 80 pretrain + 50 fine-tune schedule -- only rank differs
# within this set. This is the most heavily compressed of the 4 -- expect
# the clearest accuracy tradeoff (if any) to show up here first.
#
#   python scripts/train.py --config configs/baseline_fno.yaml --experiment configs/experiments/tucker_rank_0.05_residual.yaml
#   python scripts/evaluate.py --config configs/baseline_fno.yaml --experiment configs/experiments/tucker_rank_0.05_residual.yaml --targets coarse
run_name: "tucker_rank_0.05_residual"

model:
  target_mode: "residual"
  factorization: "tucker"
  rank: 0.05

training:
  seed: 42
  # epochs/finetune_epochs deliberately NOT overridden here -- inherits
  # baseline_fno.yaml's 80 (pretrain) + 50 (fine-tune) as-is.
