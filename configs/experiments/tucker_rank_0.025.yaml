# Extreme-end extension of the tucker rank sweep (0.75, 0.5, 0.25, 0.05,
# now also 0.025, 0.01 -- see tucker_rank_0.05.yaml for the original 4-way
# sweep). Same seed, same 1985-2014 training window, same 80 pretrain + 50
# fine-tune schedule as the baseline -- only rank differs. More compressed
# than 0.05; probes whether accuracy degrades gracefully or falls off a
# cliff below the previous sweep's most extreme point.
#
#   python scripts/train.py --config configs/baseline_fno.yaml --experiment configs/experiments/tucker_rank_0.025.yaml
#   python scripts/evaluate.py --config configs/baseline_fno.yaml --experiment configs/experiments/tucker_rank_0.025.yaml --targets coarse
run_name: "tucker_rank_0.025"

model:
  factorization: "tucker"
  rank: 0.025

training:
  # Same seed across the whole sweep -- see tucker_rank_0.75.yaml's comment.
  seed: 42
  # epochs/finetune_epochs deliberately NOT overridden here -- inherits
  # baseline_fno.yaml's 80 (pretrain) + 50 (fine-tune) as-is.
