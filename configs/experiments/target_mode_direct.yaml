# One half of a direct-vs-residual comparison (see
# configs/experiments/target_mode_residual.yaml for the other half).
# Same architecture as configs/baseline_fno.yaml exactly (no
# factorization, n_modes [16, 32], hidden_channels 64, n_layers 4) --
# this file only changes run_name and model.target_mode, so any
# difference in results between the two runs comes purely from
# direct-vs-residual prediction, not from some other config difference.
#
#   python scripts/train.py --config configs/baseline_fno.yaml --experiment configs/experiments/target_mode_direct.yaml
#   python scripts/evaluate.py --config configs/baseline_fno.yaml --experiment configs/experiments/target_mode_direct.yaml --targets coarse
run_name: "target_mode_direct"

model:
  target_mode: "direct"

training:
  # Same seed as target_mode_residual.yaml -- both start from identical
  # weight init and see batches in identical order, so any difference in
  # results is attributable to target_mode, not to random luck. (Already
  # baseline_fno.yaml's default; set explicitly here so this file stays
  # self-documenting on its own.)
  seed: 42
  epochs: 200
